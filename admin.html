<!doctype html>
<html lang="bn" data-theme="groom">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>আশীর্বাদ বার্তা</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{ background:var(--cream); color:#3A0B16; }
  .admin{ max-width:760px; margin:0 auto; padding:32px 18px 60px; }
  .admin h1{ font-family:"Lipishree",serif; font-weight:400; color:var(--maroon); font-size:40px; line-height:1.6; text-align:center; margin:0; }
  .sub{ text-align:center; color:#6B3A44; font-size:15px; margin:0; }
  .panel{ margin-top:22px; padding:20px; border-radius:16px; background:#FFFDF8; box-shadow:0 0 0 1px rgba(201,160,78,.6), 0 8px 20px rgba(40,0,10,.06); }
  label{ display:block; font-weight:600; color:var(--maroon); font-size:15px; margin-bottom:6px; }
  input[type=email], input[type=search]{ width:100%; font:16px/1.6 "Noto Serif Bengali",serif; padding:10px 14px; border-radius:12px; border:1px solid rgba(201,160,78,.75); background:#fff; color:#3A0B16; }
  .btn{ margin-top:14px; }
  .row{ display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat{ text-align:center; padding:12px 6px; border-radius:12px; background:var(--cream); }
  .stat b{ display:block; font-size:28px; line-height:1.3; color:var(--maroon); }
  .stat span{ font-size:13.5px; color:#6B3A44; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:16px; }
  .tabs button{ border:1px solid rgba(201,160,78,.8); background:#fff; color:var(--maroon); border-radius:999px; padding:7px 14px; font:600 14px "Noto Serif Bengali",serif; cursor:pointer; }
  .tabs button[aria-pressed="true"]{ background:var(--maroon); color:var(--cream); border-color:var(--maroon); }
  .tools{ display:flex; gap:10px; margin-top:12px; align-items:center; }
  .tools input{ flex:1; }
  .ghost{ border:1px solid var(--maroon); background:transparent; color:var(--maroon); border-radius:999px; padding:9px 16px; font:600 14px "Noto Serif Bengali",serif; cursor:pointer; white-space:nowrap; }
  .msg{ padding:14px 0; border-bottom:1px solid rgba(201,160,78,.35); }
  .msg:last-child{ border-bottom:0; }
  .msg-head{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
  .msg-name{ font-weight:600; color:var(--maroon); font-size:16.5px; }
  .tag{ display:inline-block; font-size:12.5px; font-weight:400; color:#6B3A44; border:1px solid rgba(201,160,78,.6); border-radius:999px; padding:0 8px; margin-left:6px; }
  .msg-time{ color:#6B3A44; font-size:13.5px; }
  .msg-text{ white-space:pre-wrap; margin:4px 0 0; line-height:1.8; overflow-wrap:anywhere; }
  .del{ border:0; background:none; color:#A3182F; font:14px "Noto Serif Bengali",serif; cursor:pointer; padding:4px 0; }
  .link{ border:0; background:none; color:var(--maroon); text-decoration:underline; font:15px "Noto Serif Bengali",serif; cursor:pointer; }
  .note{ margin:12px 0 0; font-size:15px; line-height:1.7; }
  .note.err{ color:#A3182F; } .note.ok{ color:#2E6B3A; }
  [hidden]{ display:none !important; }
</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
</head>
<body>
<main class="admin">
  <h1>আশীর্বাদ বার্তা</h1>
  <p class="sub">অতিথিদের পাঠানো শুভেচ্ছা, দুই পক্ষের কার্ড থেকেই</p>

  <section class="panel" id="loginPanel" hidden>
    <form id="loginForm">
      <label for="email">আপনার ইমেল</label>
      <input id="email" type="email" autocomplete="email" required>
      <button class="btn" type="submit" id="loginBtn">লগইন লিঙ্ক পাঠান</button>
    </form>
    <p class="note" id="loginNote" role="status"></p>
  </section>

  <section id="appPanel" hidden>
    <div class="panel">
      <div class="stats">
        <div class="stat"><b id="nAll">০</b><span>মোট বার্তা</span></div>
        <div class="stat"><b id="nGroom">০</b><span>বরপক্ষের কার্ড</span></div>
        <div class="stat"><b id="nBride">০</b><span>কন্যাপক্ষের কার্ড</span></div>
      </div>
      <div class="tabs" role="group" aria-label="কোন কার্ডের বার্তা">
        <button type="button" data-f="all" aria-pressed="true">সব</button>
        <button type="button" data-f="groom" aria-pressed="false">বরপক্ষ</button>
        <button type="button" data-f="bride" aria-pressed="false">কন্যাপক্ষ</button>
      </div>
      <div class="tools">
        <input type="search" id="q" placeholder="নাম বা বার্তায় খুঁজুন" aria-label="খুঁজুন">
        <button class="ghost" type="button" id="csv">Excel-এ ডাউনলোড</button>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="msg-time" id="updated"></span>
        <span><button class="link" id="refresh" type="button">আবার লোড করুন</button> &nbsp; <button class="link" id="logout" type="button">লগআউট</button></span>
      </div>
    </div>
    <div class="panel">
      <p class="note" id="listNote" role="status"></p>
      <div id="list"></div>
    </div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
